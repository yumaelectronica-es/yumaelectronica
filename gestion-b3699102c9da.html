<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="noindex, nofollow">

        <title>Panel de administración — Yuma Electrónica</title>

        <link rel="icon" type="image/png" href="/assets/img/favicon.png">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">

        <link rel="stylesheet" href="/assets/css/app.css?v=20260811">
        <script defer src="/assets/js/cart.js?v=20260811"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <style>[x-cloak]{display:none!important}</style>
    </head>
    <body class="bg-ink-50 text-ink-900" x-data="adminApp()" x-init="init()">

        <template x-if="!authed">
            <div class="flex min-h-screen items-center justify-center px-6">
                <div class="w-full max-w-sm rounded-2xl border border-ink-100 bg-white p-6 shadow-card">
                    <div class="flex items-center gap-2.5">
                        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-brand-500 text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 shrink-0"><path d="M12 2 3 7v6c0 5 4 8.5 9 9 5-.5 9-4 9-9V7l-9-5Z"/></svg>
                        </span>
                        <div>
                            <p class="text-body-sm font-bold text-ink-900">Yuma Electrónica</p>
                            <p class="text-caption text-ink-500">Panel de administración</p>
                        </div>
                    </div>
                    <form @submit.prevent="login()" class="mt-5">
                        <label for="admin-user" class="mb-1.5 block text-caption font-medium text-ink-600">Correo electrónico</label>
                        <input id="admin-user" type="email" x-model="username" autofocus autocomplete="username" class="h-11 w-full rounded-lg border-ink-200 text-body-sm text-ink-900 focus:border-brand-500 focus:ring-brand-500">
                        <label for="admin-pass" class="mb-1.5 mt-3 block text-caption font-medium text-ink-600">Contraseña</label>
                        <input id="admin-pass" type="password" x-model="password" autocomplete="current-password" class="h-11 w-full rounded-lg border-ink-200 text-body-sm text-ink-900 focus:border-brand-500 focus:ring-brand-500">
                        <p class="mt-2 text-[11px] text-danger-600" x-show="loginError" x-cloak x-text="loginError"></p>
                        <button type="submit" class="mt-4 inline-flex h-11 w-full items-center justify-center rounded-lg bg-brand-500 text-body-sm font-semibold text-white shadow-card transition hover:bg-brand-600">Entrar</button>
                    </form>
                    <p class="mt-4 text-[11px] leading-relaxed text-ink-400">Acceso restringido. Si no tienes las credenciales, contacta con el administrador del sitio.</p>
                </div>
            </div>
        </template>

        <template x-if="authed">
            <div class="min-h-screen">
                <header class="border-b border-ink-100 bg-white">
                    <div class="mx-auto hidden max-w-container items-center justify-between gap-4 px-6 py-4 lg:flex">
                        <div class="flex items-center gap-2.5">
                            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-brand-500 text-white">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 shrink-0"><path d="M12 2 3 7v6c0 5 4 8.5 9 9 5-.5 9-4 9-9V7l-9-5Z"/></svg>
                            </span>
                            <div>
                                <p class="text-body-sm font-bold text-ink-900">Yuma Electrónica</p>
                                <p class="text-caption text-ink-500">Panel de administración</p>
                            </div>
                        </div>
                        <a href="/index.html" class="text-caption font-medium text-ink-500 hover:text-ink-800">Ver tienda</a>
                        <button type="button" @click="logout()" class="shrink-0 rounded-lg border border-ink-200 px-4 py-2 text-caption font-semibold text-ink-600 transition hover:text-danger-600">Cerrar sesión</button>
                    </div>

                    <div class="flex items-center justify-between gap-2 px-3 py-3 lg:hidden">
                        <button type="button" @click="mobileNavOpen = true" aria-label="Abrir menú" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-ink-600 transition hover:bg-ink-50">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                        </button>
                        <div class="flex min-w-0 flex-1 items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0 text-brand-600" x-html="currentTab().icon"></svg>
                            <span class="truncate text-body-sm font-semibold text-ink-900" x-text="currentTab().label"></span>
                        </div>
                        <button type="button" @click="tab = 'notifications'" aria-label="Notificaciones" class="relative flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-ink-600 transition hover:bg-ink-50">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                            <span class="absolute -right-0.5 -top-0.5 flex h-4 min-w-[16px] items-center justify-center rounded-full bg-danger-500 px-1 text-[10px] font-bold text-white" x-show="notifications.length > 0" x-cloak x-text="notifications.length"></span>
                        </button>
                    </div>
                </header>

                <template x-if="mobileNavOpen">
                    <div class="fixed inset-0 z-50 lg:hidden">
                        <div class="absolute inset-0 bg-ink-900/55" x-transition:enter="transition duration-2 ease-out" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition duration-2 ease-in" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" @click="mobileNavOpen = false"></div>
                        <div class="absolute inset-y-0 left-0 flex w-72 max-w-[80%] flex-col overflow-y-auto bg-white p-4 shadow-modal" x-transition:enter="transition duration-3 ease-out" x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0" x-transition:leave="transition duration-2 ease-in" x-transition:leave-start="translate-x-0" x-transition:leave-end="-translate-x-full">
                            <div class="flex items-center justify-between gap-2">
                                <div class="flex items-center gap-2.5">
                                    <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-brand-500 text-white">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 shrink-0"><path d="M12 2 3 7v6c0 5 4 8.5 9 9 5-.5 9-4 9-9V7l-9-5Z"/></svg>
                                    </span>
                                    <p class="text-body-sm font-bold text-ink-900">Yuma Electrónica</p>
                                </div>
                                <button type="button" @click="mobileNavOpen = false" aria-label="Cerrar menú" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-ink-400 hover:bg-ink-50 hover:text-ink-700">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 shrink-0"><path d="M18 6 6 18M6 6l12 12"/></svg>
                                </button>
                            </div>

                            <nav class="mt-5 flex-1 space-y-1">
                                <template x-for="t in tabs" :key="t.id">
                                    <button type="button" @click="tab = t.id; mobileNavOpen = false" class="flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-left text-body-sm font-semibold transition duration-2" :class="tab === t.id ? 'bg-brand-50 text-brand-700' : 'text-ink-600 hover:bg-ink-50'">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" x-html="t.icon"></svg>
                                        <span class="flex-1" x-text="t.label"></span>
                                        <span class="inline-flex h-5 min-w-[20px] items-center justify-center rounded-full bg-danger-500 px-1 text-[10px] font-bold text-white" x-show="t.id === 'notifications' && notifications.length > 0" x-cloak x-text="notifications.length"></span>
                                    </button>
                                </template>
                            </nav>

                            <div class="space-y-1 border-t border-ink-100 pt-3">
                                <a href="/index.html" class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-body-sm font-semibold text-ink-600 transition duration-2 hover:bg-ink-50">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg>
                                    <span class="flex-1">Ver tienda</span>
                                </a>
                                <button type="button" @click="logout()" class="flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-left text-body-sm font-semibold text-danger-600 transition duration-2 hover:bg-danger-50">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
                                    <span class="flex-1">Cerrar sesión</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>

                <div class="mx-auto flex max-w-container items-start gap-6 px-4 py-6 sm:px-6 sm:py-8">
                    <aside class="hidden shrink-0 lg:block lg:w-64">
                        <nav class="sticky top-6 space-y-1 rounded-2xl border border-ink-100 bg-white p-3 shadow-card">
                            <button type="button" @click="tab = 'dashboard'" class="flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-left text-body-sm font-semibold transition duration-2" :class="tab === 'dashboard' ? 'bg-brand-50 text-brand-700' : 'text-ink-600 hover:bg-ink-50'">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                                <span class="flex-1">Panel de control</span>
                            </button>
                            <button type="button" @click="tab = 'products'" class="flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-left text-body-sm font-semibold transition duration-2" :class="tab === 'products' ? 'bg-brand-50 text-brand-700' : 'text-ink-600 hover:bg-ink-50'">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"><path d="M21 7.5a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 7.5v9a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73Z"/><path d="M3.3 6.5 12 11.5l8.7-5M12 21.5v-10"/></svg>
                                <span class="flex-1">Productos</span>
                            </button>
                            <button type="button" @click="tab = 'orders'" class="flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-left text-body-sm font-semibold transition duration-2" :class="tab === 'orders' ? 'bg-brand-50 text-brand-700' : 'text-ink-600 hover:bg-ink-50'">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"><rect x="1" y="6" width="15" height="12" rx="1"/><path d="M16 10h3l3 3v5h-6z"/><circle cx="6" cy="19" r="1.5"/><circle cx="17.5" cy="19" r="1.5"/></svg>
                                <span class="flex-1">Pedidos</span>
                            </button>
                            <button type="button" @click="tab = 'coupons'" class="flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-left text-body-sm font-semibold transition duration-2" :class="tab === 'coupons' ? 'bg-brand-50 text-brand-700' : 'text-ink-600 hover:bg-ink-50'">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"><path d="M20.6 12.6 12.6 20.6a2 2 0 0 1-2.8 0L3 13.8V3h10.8l6.8 6.8a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/></svg>
                                <span class="flex-1">Cupones</span>
                            </button>
                            <button type="button" @click="tab = 'notifications'" class="flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-left text-body-sm font-semibold transition duration-2" :class="tab === 'notifications' ? 'bg-brand-50 text-brand-700' : 'text-ink-600 hover:bg-ink-50'">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                                <span class="flex-1">Notificaciones</span>
                                <span class="inline-flex h-5 min-w-[20px] items-center justify-center rounded-full bg-danger-500 px-1 text-[10px] font-bold text-white" x-show="notifications.length > 0" x-cloak x-text="notifications.length"></span>
                            </button>
                            <button type="button" @click="tab = 'payments'" class="flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-left text-body-sm font-semibold transition duration-2" :class="tab === 'payments' ? 'bg-brand-50 text-brand-700' : 'text-ink-600 hover:bg-ink-50'">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
                                <span class="flex-1">Datos de pago</span>
                            </button>
                            <button type="button" @click="tab = 'customers'" class="flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-left text-body-sm font-semibold transition duration-2" :class="tab === 'customers' ? 'bg-brand-50 text-brand-700' : 'text-ink-600 hover:bg-ink-50'">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                                <span class="flex-1">Clientes</span>
                            </button>
                            <button type="button" @click="tab = 'visitors'" class="flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-left text-body-sm font-semibold transition duration-2" :class="tab === 'visitors' ? 'bg-brand-50 text-brand-700' : 'text-ink-600 hover:bg-ink-50'">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
                                <span class="flex-1">Visitantes</span>
                            </button>
                            <button type="button" @click="tab = 'carts'" class="flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-left text-body-sm font-semibold transition duration-2" :class="tab === 'carts' ? 'bg-brand-50 text-brand-700' : 'text-ink-600 hover:bg-ink-50'">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.5 3h2l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 7.5H6"/></svg>
                                <span class="flex-1">Carritos abandonados</span>
                            </button>
                        </nav>
                    </aside>

                    <main class="min-w-0 flex-1">

                    <template x-if="tab === 'dashboard'">
                        <div>
                            <h1 class="text-h3 text-ink-900">Panel de control</h1>
                            <div class="mt-4 grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5">
                                <div class="rounded-2xl border border-ink-100 bg-white p-4 shadow-card">
                                    <p class="text-caption text-ink-500">Pedidos totales</p>
                                    <p class="mt-1 font-display text-h3 font-bold text-ink-900" x-text="orders.length"></p>
                                </div>
                                <div class="rounded-2xl border border-ink-100 bg-white p-4 shadow-card">
                                    <p class="text-caption text-ink-500">Facturado</p>
                                    <p class="mt-1 font-display text-h3 font-bold text-ink-900" x-text="fmt(orders.reduce((s,o) => s + (o.total||0), 0))"></p>
                                </div>
                                <div class="rounded-2xl border border-ink-100 bg-white p-4 shadow-card">
                                    <p class="text-caption text-ink-500">Clientes</p>
                                    <p class="mt-1 font-display text-h3 font-bold text-ink-900" x-text="accounts.length"></p>
                                </div>
                                <div class="rounded-2xl border border-ink-100 bg-white p-4 shadow-card">
                                    <p class="text-caption text-ink-500">Productos desactivados</p>
                                    <p class="mt-1 font-display text-h3 font-bold text-ink-900" x-text="disabledProducts.length"></p>
                                </div>
                                <div class="rounded-2xl border border-ink-100 bg-white p-4 shadow-card">
                                    <p class="text-caption text-ink-500">Notificaciones</p>
                                    <p class="mt-1 font-display text-h3 font-bold" :class="notifications.length ? 'text-danger-600' : 'text-ink-900'" x-text="notifications.length"></p>
                                </div>
                            </div>

                            <div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-2">
                                <div class="rounded-2xl border border-ink-100 bg-white p-5 shadow-card">
                                    <div class="flex items-center justify-between">
                                        <h2 class="text-h4 text-ink-900">Últimos pedidos</h2>
                                        <button type="button" @click="tab = 'orders'" class="text-caption font-semibold text-brand-600 hover:text-brand-700">Ver todos</button>
                                    </div>
                                    <div class="mt-3 space-y-2">
                                        <template x-for="order in orders.slice(0, 5)" :key="order.orderNumber">
                                            <div class="flex items-center justify-between gap-3 border-t border-ink-100 pt-2 text-body-sm first:border-0 first:pt-0">
                                                <span class="min-w-0 truncate text-ink-700"><span class="font-semibold text-ink-900" x-text="order.orderNumber"></span> · <span x-text="order.email"></span></span>
                                                <span class="shrink-0 tabular-nums font-semibold text-ink-900" x-text="fmt(order.total)"></span>
                                            </div>
                                        </template>
                                        <p class="text-body-sm text-ink-400" x-show="orders.length === 0" x-cloak>Todavía no hay pedidos.</p>
                                    </div>
                                </div>
                                <div class="rounded-2xl border border-ink-100 bg-white p-5 shadow-card">
                                    <div class="flex items-center justify-between">
                                        <h2 class="text-h4 text-ink-900">Notificaciones recientes</h2>
                                        <button type="button" @click="tab = 'notifications'" class="text-caption font-semibold text-brand-600 hover:text-brand-700">Ver todas</button>
                                    </div>
                                    <div class="mt-3 space-y-2">
                                        <template x-for="n in notifications.slice(0, 5)" :key="n.id">
                                            <div class="border-t border-ink-100 pt-2 text-body-sm text-ink-700 first:border-0 first:pt-0" x-text="n.text"></div>
                                        </template>
                                        <p class="text-body-sm text-ink-400" x-show="notifications.length === 0" x-cloak>Sin notificaciones pendientes.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <template x-if="tab === 'products'">
                        <div>
                            <h1 class="text-h3 text-ink-900">Productos</h1>
                            <p class="mt-1 text-body-sm text-ink-500">El catálogo son fichas HTML estáticas: aquí no se edita su contenido, solo se activa o desactiva la venta. Un producto desactivado muestra "No disponible" en su ficha y en los listados.</p>

                            <input type="search" x-model="productSearch" placeholder="Buscar por nombre o marca…" class="mt-4 h-11 w-full max-w-sm rounded-lg border-ink-200 text-body-sm text-ink-900 focus:border-brand-500 focus:ring-brand-500">
                            <p class="mt-2 text-[11px] text-ink-400" x-show="!productsLoaded" x-cloak>Cargando catálogo…</p>
                            <p class="mt-2 text-[11px] text-ink-400" x-show="productsLoaded && !productSearch.trim()" x-cloak>Mostrando los primeros 60 productos. Usa el buscador para encontrar uno concreto.</p>

                            <div class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3" x-show="productsLoaded">
                                <template x-for="p in filteredProducts()" :key="p.id">
                                    <div class="flex items-center gap-3 rounded-xl border border-ink-100 bg-white p-3 shadow-card">
                                        <img :src="p.image" :alt="p.name" class="h-14 w-14 shrink-0 rounded-lg border border-ink-100 object-contain p-1">

        <script>
            var ADMIN_USERNAME = 'yumaelectronica@gmail.com';
            var ADMIN_PASSWORD = 'e7Li6M02IoyUUSCB';
            var ADMIN_SESSION_KEY = 'yuma_admin_session_v1';

            function adminApp() {
                return {
                    authed: false,
                    username: '',
                    password: '',
                    loginError: '',
                    tab: 'dashboard',
                    mobileNavOpen: false,
                    tabs: [
                        { id: 'dashboard', label: 'Panel de control', icon: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>' },
                        { id: 'products', label: 'Productos', icon: '<path d="M21 7.5a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 7.5v9a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73Z"/><path d="M3.3 6.5 12 11.5l8.7-5M12 21.5v-10"/>' },
                        { id: 'orders', label: 'Pedidos', icon: '<rect x="1" y="6" width="15" height="12" rx="1"/><path d="M16 10h3l3 3v5h-6z"/><circle cx="6" cy="19" r="1.5"/><circle cx="17.5" cy="19" r="1.5"/>' },
                        { id: 'coupons', label: 'Cupones', icon: '<path d="M20.6 12.6 12.6 20.6a2 2 0 0 1-2.8 0L3 13.8V3h10.8l6.8 6.8a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/>' },
                        { id: 'notifications', label: 'Notificaciones', icon: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>' },
                        { id: 'payments', label: 'Datos de pago', icon: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>' },
                        { id: 'customers', label: 'Clientes', icon: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>' },
                        { id: 'visitors', label: 'Visitantes', icon: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/>' },
                        { id: 'carts', label: 'Carritos abandonados', icon: '<circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.5 3h2l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 7.5H6"/>' }
                    ],
                    orders: [],
                    accounts: [],
                    notifications: [],
                    visits: [],
                    abandonedCarts: [],
                    search: '',
                    selectedOrder: null,
                    ORDER_STEPS: [],
                    products: [],
                    productsLoaded: false,
                    productSearch: '',
                    disabledProducts: [],
                    paymentForm: {},
                    paymentsSaved: false,
                    paymentsSaving: false,
                    paymentsError: false,
                    coupons: [],
                    couponForm: { code: '', type: 'percent', value: '', label: '', minSubtotal: '' },
                    couponFormError: '',
                    rejectingProof: false,
                    rejectReason: '',

                    init() {
                        this.ORDER_STEPS = window.ORDER_STEPS || [];
                        this.authed = sessionStorage.getItem(ADMIN_SESSION_KEY) === '1';
                        var hashTab = (window.location.hash || '').replace('#', '');
                        if (hashTab && this.tabs.some(function (t) { return t.id === hashTab; })) this.tab = hashTab;
                        this.$watch('tab', (value) => { window.location.hash = value; });
                        if (this.authed) this.loadData();
                    },
                    login() {
                        if (this.username === ADMIN_USERNAME && this.password === ADMIN_PASSWORD) {
                            sessionStorage.setItem(ADMIN_SESSION_KEY, '1');
                            this.authed = true;
                            this.loginError = '';
                            this.loadData();
                        } else {
                            this.loginError = 'Usuario o contraseña incorrectos.';
                        }
                    },
                    logout() {
                        sessionStorage.removeItem(ADMIN_SESSION_KEY);
                        this.authed = false;
                        this.username = '';
                        this.password = '';
                    },
                    loadData() {
                        this.orders = getAllOrders();
                        this.accounts = getAllAccountsList();
                        this.notifications = getNotifications();
                        this.visits = getVisits();
                        this.abandonedCarts = getAbandonedCarts();
                        this.disabledProducts = getDisabledProducts();
                        this.paymentForm = getPaymentConfig();
                        this.loadProducts();
                        this.loadOrdersFromApi();
                        this.loadCoupons();
                        this.loadPaymentConfig();
                    },
                    loadPaymentConfig() {
                        var self = this;
                        apiGetPaymentConfig().then(function (res) {
                            if (res && res.ok && res.config) self.paymentForm = res.config;
                        });
                    },
                    loadCoupons() {
                        var self = this;
                        apiListCoupons().then(function (res) {
                            if (res && res.ok && Array.isArray(res.coupons)) self.coupons = res.coupons;
                        });
                    },
                    loadOrdersFromApi() {
                        var self = this;
                        apiListOrders().then(function (res) {
                            if (!res || !res.ok || !Array.isArray(res.orders)) return;
                            // DB orders are the source of truth (visible from any device);
                            // keep any local-only orders (e.g. saved before the DB existed)
                            // that aren't in the DB response.
                            var byNumber = {};
                            res.orders.forEach(function (o) { byNumber[o.orderNumber] = o; });
                            self.orders.forEach(function (o) {
                                if (!byNumber[o.orderNumber]) byNumber[o.orderNumber] = o;
                            });
                            self.orders = Object.values(byNumber).sort(function (a, b) {
                                return new Date(b.date || 0) - new Date(a.date || 0);
                            });
                            if (self.selectedOrder) {
                                var updated = self.orders.find(function (o) { return o.orderNumber === self.selectedOrder.orderNumber; });
                                if (updated) self.selectedOrder = updated;
                            }
                        });
                    },
                    loadProducts() {
                        var self = this;
                        fetch('/assets/js/products-index.json')
                            .then(function (r) { return r.json(); })
                            .then(function (data) {
                                self.products = Array.isArray(data) ? data : [];
                                self.productsLoaded = true;
                            })
                            .catch(function () { self.productsLoaded = true; });
                    },
                    filteredProducts() {
                        var q = this.productSearch.trim().toLowerCase();
                        if (!q) return this.products.slice(0, 60);
                        return this.products.filter(function (p) {
                            return (p.name || '').toLowerCase().indexOf(q) > -1 || (p.brand || '').toLowerCase().indexOf(q) > -1 || (p.id || '') === q;
                        }).slice(0, 60);
                    },
                    isDisabled(id) { return this.disabledProducts.indexOf(String(id)) > -1; },
                    toggleProduct(id) {
                        var disabled = this.isDisabled(id);
                        setProductDisabled(id, !disabled);
                        this.disabledProducts = getDisabledProducts();
                    },
                    disabledProductDetails() {
                        var self = this;
                        return this.products.filter(function (p) { return self.disabledProducts.indexOf(String(p.id)) > -1; });
                    },
                    filteredOrders() {
                        var q = this.search.trim().toLowerCase();
                        if (!q) return this.orders;
                        return this.orders.filter(function (o) {
                            return (o.orderNumber || '').toLowerCase().indexOf(q) > -1 || (o.email || '').toLowerCase().indexOf(q) > -1;
                        });
                    },
                    select(order) {
                        this.selectedOrder = order;
                        this.rejectingProof = false;
                        this.rejectReason = '';
                    },
                    closeDetail() { this.selectedOrder = null; },
                    proofStatusInfo(order) {
                        if (!order.paymentProofName) return { label: 'Sin justificante', cls: 'text-ink-400' };
                        if (order.paymentProofStatus === 'approved') return { label: 'Aprobado', cls: 'text-savings-700' };
                        if (order.paymentProofStatus === 'rejected') return { label: 'Rechazado', cls: 'text-danger-600' };
                        return { label: 'Pendiente de revisión', cls: 'text-amber-900' };
                    },
                    proofBoxClass(order) {
                        if (!order.paymentProofName) return 'border-ink-100 bg-ink-50 text-ink-500';
                        if (order.paymentProofStatus === 'approved') return 'border-savings-500 bg-savings-50 text-savings-700';
                        if (order.paymentProofStatus === 'rejected') return 'border-danger-200 bg-danger-50 text-danger-600';
                        return 'border-amber-200 bg-amber-200/30 text-amber-900';
                    },
                    canSetStatus(order, idx) {
                        var cur = this.status(order).stepIndex;
                        if (idx <= cur) return true;
                        if (idx === cur + 1 && order.paymentProofStatus === 'approved') return true;
                        return false;
                    },
                    approveProof(order) {
                        apiApproveProof(order.orderNumber).then(function (res) {
                            if (!res || !res.ok) { showToast('No se pudo aprobar el justificante'); return; }
                            order.paymentProofStatus = 'approved';
                            order.paymentProofRejectionReason = null;
                            showToast('Justificante aprobado');
                        });
                    },
                    rejectProof(order) {
                        var self = this;
                        var reason = this.rejectReason.trim() || 'El justificante no es válido, súbelo de nuevo.';
                        apiRejectProof(order.orderNumber, reason).then(function (res) {
                            if (!res || !res.ok) { showToast('No se pudo rechazar el justificante'); return; }
                            order.paymentProofStatus = 'rejected';
                            order.paymentProofRejectionReason = reason;
                            self.rejectingProof = false;
                            self.rejectReason = '';
                            showToast('Justificante rechazado');
                        });
                    },
                    createCoupon() {
                        var self = this;
                        var f = this.couponForm;
                        this.couponFormError = '';
                        if (!f.code.trim() || !f.value || Number(f.value) <= 0) {
                            this.couponFormError = 'Completa el código y un valor válido.';
                            return;
                        }
                        apiCreateCoupon({
                            code: f.code.trim().toUpperCase(),
                            type: f.type,
                            value: Number(f.value),
                            label: f.label,
                            minSubtotal: Number(f.minSubtotal) || 0
                        }).then(function (res) {
                            if (!res || !res.ok) {
                                self.couponFormError = (res && res.error === 'duplicate_code') ? 'Ya existe un cupón con ese código.' : 'No se pudo crear el cupón.';
                                return;
                            }
                            self.couponForm = { code: '', type: 'percent', value: '', label: '', minSubtotal: '' };
                            self.loadCoupons();
                            showToast('Cupón creado');
                        });
                    },
                    toggleCouponActive(c) {
                        apiToggleCoupon(c.id, !c.active).then(function (res) {
                            if (res && res.ok) c.active = !c.active;
                        });
                    },
                    deleteCoupon(c) {
                        var self = this;
                        apiDeleteCoupon(c.id).then(function (res) {
                            if (res && res.ok) self.coupons = self.coupons.filter(function (x) { return x.id !== c.id; });
                        });
                    },
                    openOrderFromNotification(orderNumber) {
                        var order = this.orders.find(function (o) { return o.orderNumber === orderNumber; });
                        if (order) { this.tab = 'orders'; this.selectedOrder = order; }
                    },
                    dismissNotif(id) {
                        dismissNotification(id);
                        this.notifications = getNotifications();
                    },
                    setStatus(order, idx) {
                        if (!this.canSetStatus(order, idx)) {
                            showToast('El justificante debe estar aprobado y los pasos deben seguirse en orden.');
                            return;
                        }
                        var self = this;
                        apiUpdateOrderStatus(order.orderNumber, idx).then(function (res) {
                            if (!res || !res.ok) {
                                showToast('No se pudo actualizar el estado del pedido.');
                                return;
                            }
                            setOrderStatus(order.orderNumber, idx);
                            sendOrderEmail(order, 'status', { statusLabel: (self.ORDER_STEPS[idx] || {}).label || '' });
                            self.loadData();
                            var updated = self.orders.find(function (o) { return o.orderNumber === order.orderNumber; });
                            self.selectedOrder = updated || null;
                        });
                    },
                    savePayments() {
                        var self = this;
                        if (!this.paymentForm.transferEnabled && !this.paymentForm.bizumEnabled) return;
                        this.paymentsSaving = true;
                        this.paymentsSaved = false;
                        this.paymentsError = false;
                        savePaymentConfig(this.paymentForm);
                        apiSavePaymentConfig(this.paymentForm).then(function (res) {
                            self.paymentsSaving = false;
                            if (!res || !res.ok) {
                                self.paymentsError = true;
                                setTimeout(() => { self.paymentsError = false; }, 4000);
                                return;
                            }
                            // Re-read from the DB (not just echo back the form) so the
                            // confirmation reflects what's actually now live on the site.
                            self.loadPaymentConfig();
                            self.paymentsSaved = true;
                            setTimeout(() => { self.paymentsSaved = false; }, 4000);
                        });
                    },
                    clearVisitLog() {
                        clearVisits();
                        this.visits = [];
                    },
                    ordersForAccount(email) {
                        email = (email || '').toLowerCase();
                        return this.orders.filter(function (o) { return (o.email || '').toLowerCase() === email; });
                    },
                    totalSpent(email) {
                        return this.ordersForAccount(email).reduce(function (s, o) { return s + (o.total || 0); }, 0);
                    },
                    status(order) { return orderStatus(order); },
                    currentTab() {
                        return this.tabs.find(t => t.id === this.tab) || this.tabs[0];
                    },
                    fmt(n) { return fmtEUR(n); },
                    formatDate(d) {
                        try {
                            return new Date(d).toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
                        } catch (e) { return ''; }
                    },
                    formatDateTime(d) {
                        try {
                            return new Date(d).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }) + ' · ' + new Date(d).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
                        } catch (e) { return ''; }
                    }
                };
            }
        </script>
    </body>
</html>
